name: Run Unit Tests

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, squidsec]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install pytest

    - name: Verify dependencies import
      run: |
        python -c "import networkx, rich, tqdm, yaml; print('All dependencies OK')"

    - name: Run unit + integration tests
      run: |
        python -m pytest test_bloodbash.py test_members_ingest.py \
          test_detection_variations.py test_compromise_dossier.py \
          test_synthetic_corpus.py test_ludus_collections.py \
          test_real_data_reliability.py -q

    - name: Complex environment battery (required gate)
      # 10 multi-issue synthetic AD labs → BloodBash → ground-truth checks.
      # Must pass before merge when this workflow is a required status check.
      run: |
        python tools/run_scenario_battery.py --count 20 --seed 42
      timeout-minutes: 15
