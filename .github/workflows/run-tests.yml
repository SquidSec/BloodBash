name: Run Unit Tests

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install pytest

    - name: Verify dependencies import
      run: |
        python -c "import networkx, rich, tqdm, yaml; print('All dependencies OK')"

    - name: Run tests
      run: |
        python -m pytest test_bloodbash.py test_members_ingest.py \
          test_detection_variations.py test_compromise_dossier.py \
          test_synthetic_corpus.py -q
