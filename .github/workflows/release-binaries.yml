name: Build and Release Binaries

# Every merge/push to main: run tests, build Linux + Windows binaries,
# and publish a GitHub Release (users download — no Python required).
on:
  push:
    branches:
      - main

# Allow this workflow to create tags and release assets
permissions:
  contents: write

concurrency:
  group: release-binaries-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest

      - name: Run unit + integration tests
        run: |
          python -m pytest test_bloodbash.py test_members_ingest.py \
            test_detection_variations.py test_compromise_dossier.py \
            test_writable_file.py \
            test_synthetic_corpus.py test_ludus_collections.py \
            test_real_data_reliability.py test_graph_cache.py \
            test_owned_file.py test_golden_path.py test_deep_paths.py \
            test_ci_pytest_suite.py -q

      - name: Complex environment battery (required gate)
        run: python tools/run_scenario_battery.py --count 20 --seed 42
        timeout-minutes: 15

  build:
    needs: test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, Linux, X64, squidsec]
            artifact_name: bloodbash-linux-x64
            pyinstaller_name: bloodbash-linux-x64
          - os: [self-hosted, Windows, X64, squidsec]
            artifact_name: bloodbash-windows-x64.exe
            pyinstaller_name: bloodbash-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller \
            --onefile \
            --console \
            --clean \
            --noconfirm \
            --name "${{ matrix.pyinstaller_name }}" \
            BloodBash.py
          chmod +x "dist/${{ matrix.pyinstaller_name }}"
          # Smoke: binary starts
          "./dist/${{ matrix.pyinstaller_name }}" --help | head -5

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --console `
            --clean `
            --noconfirm `
            --name "${{ matrix.pyinstaller_name }}" `
            BloodBash.py
          # PyInstaller produces .exe on Windows
          if (Test-Path "dist/${{ matrix.pyinstaller_name }}.exe") {
            Move-Item -Force "dist/${{ matrix.pyinstaller_name }}.exe" "dist/${{ matrix.artifact_name }}"
          } elseif (Test-Path "dist/${{ matrix.artifact_name }}") {
            Write-Host "Artifact already named ${{ matrix.artifact_name }}"
          } else {
            Get-ChildItem dist
            throw "Windows binary not found in dist/"
          }
          & "dist/${{ matrix.artifact_name }}" --help | Select-Object -First 5

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - name: Checkout (for version metadata)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bloodbash-linux-x64
          path: release-assets

      - name: Download Windows binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bloodbash-windows-x64.exe
          path: release-assets

      - name: Prepare release metadata and assets
        id: meta
        run: |
          set -euo pipefail
          BASE_VERSION=$(python3 <<'PY'
          import re
          from pathlib import Path
          text = Path("BloodBash.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)', text)
          if not m:
              raise SystemExit("Could not parse __version__ from BloodBash.py")
          print(m.group(1))
          PY
          )
          RUN="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Unique tag per main build; still readable as base version + build number
          TAG="v${BASE_VERSION}-build.${RUN}"
          RELEASE_NAME="BloodBash ${BASE_VERSION} (build ${RUN})"
          {
            echo "base_version=${BASE_VERSION}"
            echo "tag=${TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG}"
          ls -laR release-assets/
          # Artifacts may download into nested dirs depending on upload layout
          find release-assets -type f -print
          mkdir -p release-final
          LINUX=$(find release-assets -type f -name 'bloodbash-linux-x64' | head -1)
          WIN=$(find release-assets -type f -name 'bloodbash-windows-x64.exe' | head -1)
          test -n "$LINUX" && test -n "$WIN"
          cp -f "$LINUX" release-final/bloodbash-linux-x64
          cp -f "$WIN" release-final/bloodbash-windows-x64.exe
          chmod +x release-final/bloodbash-linux-x64
          ls -la release-final/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## SquidSec BloodBash ${{ steps.meta.outputs.base_version }} - build ${{ github.run_number }}

            **BloodBash** is an open source project created and managed by **[SquidSec](https://squidoffense.com/)**.

            Standalone binaries (no Python install required).

            | Platform | File |
            |----------|------|
            | Linux x64 | `bloodbash-linux-x64` |
            | Windows x64 | `bloodbash-windows-x64.exe` |

            **Commit:** `${{ steps.meta.outputs.short_sha }}`
            **Latest downloads (always current):**
            - Linux: https://github.com/${{ github.repository }}/releases/latest/download/bloodbash-linux-x64
            - Windows: https://github.com/${{ github.repository }}/releases/latest/download/bloodbash-windows-x64.exe

            ```bash
            # Linux
            chmod +x bloodbash-linux-x64
            ./bloodbash-linux-x64 /path/to/sharphound --all
            ```

            ```powershell
            # Windows
            .\bloodbash-windows-x64.exe C:\path\to\sharphound --all
            ```

            ---
            [SquidSec](https://squidoffense.com/) · [BloodBash on GitHub](https://github.com/${{ github.repository }})
          files: |
            release-final/bloodbash-linux-x64
            release-final/bloodbash-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
