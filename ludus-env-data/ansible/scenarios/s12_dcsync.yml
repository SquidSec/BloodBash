---
- hosts: dc
  gather_facts: false
  tasks:
  - ansible.windows.win_shell: |
      Import-Module ActiveDirectory
      $dn='CN=Users,DC=lab,DC=local'
      $p=ConvertTo-SecureString 'Sync!Pass1' -AsPlainText -Force
      try{Get-ADUser dcsync_user|Out-Null}catch{New-ADUser -Name dcsync_user -SamAccountName dcsync_user -AccountPassword $p -Enabled $true -PasswordNeverExpires $true -Path $dn}
      # DS-Replication-Get-Changes + All on domain root
      $domainDN = 'DC=lab,DC=local'
      $user = Get-ADUser dcsync_user
      $acl = Get-Acl ("AD:"+$domainDN)
      $id = New-Object System.Security.Principal.SecurityIdentifier($user.SID)
      $guidGet = [GUID]'1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
      $guidAll = [GUID]'1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
      foreach ($g in @($guidGet,$guidAll)) {
        $rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($id,[System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight,[System.Security.AccessControl.AccessControlType]::Allow,$g,[System.DirectoryServices.ActiveDirectorySecurityInheritance]::None)
        $acl.AddAccessRule($rule)
      }
      Set-Acl ("AD:"+$domainDN) $acl
      'S12_OK'
    args: {executable: powershell}
