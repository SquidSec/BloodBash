---
- hosts: dc
  gather_facts: false
  tasks:
  - ansible.windows.win_shell: |
      Import-Module ActiveDirectory
      $dn='CN=Users,DC=lab,DC=local'
      $p=ConvertTo-SecureString 'Shadow!Pass1' -AsPlainText -Force
      try{Get-ADUser shadow_tgt|Out-Null}catch{New-ADUser -Name shadow_tgt -SamAccountName shadow_tgt -AccountPassword $p -Enabled $true -PasswordNeverExpires $true -Path $dn}
      $user=Get-ADUser shadow_tgt; $src=Get-ADUser domainuser
      $acl=Get-Acl ("AD:"+$user.DistinguishedName)
      $id=New-Object System.Security.Principal.SecurityIdentifier($src.SID)
      # WriteProperty on Key-Credential-Link OR GenericAll; use AddKeyCredentialLink if available via GenericWrite + validated write
      $guidKCL=[GUID]'5b47d60f-6090-40b2-9f37-2a4de88f3063'
      $rule=New-Object System.DirectoryServices.ActiveDirectoryAccessRule($id,[System.DirectoryServices.ActiveDirectoryRights]::WriteProperty,[System.Security.AccessControl.AccessControlType]::Allow,$guidKCL,[System.DirectoryServices.ActiveDirectorySecurityInheritance]::None)
      $acl.AddAccessRule($rule)
      # also GenericWrite for broader detection
      $rule2=New-Object System.DirectoryServices.ActiveDirectoryAccessRule($id,[System.DirectoryServices.ActiveDirectoryRights]::GenericWrite,[System.Security.AccessControl.AccessControlType]::Allow)
      $acl.AddAccessRule($rule2)
      Set-Acl ("AD:"+$user.DistinguishedName) $acl
      'S13_OK'
    args: {executable: powershell}
