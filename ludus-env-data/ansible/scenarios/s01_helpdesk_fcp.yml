---
- hosts: dc
  gather_facts: false
  tasks:
  - ansible.windows.win_shell: |
      Import-Module ActiveDirectory
      $dn = 'CN=Users,DC=lab,DC=local'
      $gexists = $false
      try { Get-ADGroup -Identity HelpDesk | Out-Null; $gexists = $true } catch { $gexists = $false }
      if (-not $gexists) { New-ADGroup -Name HelpDesk -SamAccountName HelpDesk -GroupScope Global -GroupCategory Security -Path $dn }
      Add-ADGroupMember -Identity HelpDesk -Members domainuser -ErrorAction SilentlyContinue
      $p = ConvertTo-SecureString 'HopAdmin!x' -AsPlainText -Force
      $exists = $false
      try { Get-ADUser -Identity hopadmin | Out-Null; $exists = $true } catch { $exists = $false }
      if (-not $exists) {
        New-ADUser -Name hopadmin -SamAccountName hopadmin -AccountPassword $p -Enabled $true -PasswordNeverExpires $true -Path $dn
      } else {
        Set-ADAccountPassword -Identity hopadmin -NewPassword $p -Reset
        Enable-ADAccount -Identity hopadmin
      }
      $user = Get-ADUser -Identity hopadmin
      $group = Get-ADGroup -Identity HelpDesk
      $acl = Get-Acl -Path ("AD:" + $user.DistinguishedName)
      $right = [GUID]'00299570-246d-11d0-a768-00aa006e0529'
      $id = New-Object System.Security.Principal.SecurityIdentifier($group.SID)
      $rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($id,[System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight,[System.Security.AccessControl.AccessControlType]::Allow,$right,[System.DirectoryServices.ActiveDirectorySecurityInheritance]::None)
      $acl.AddAccessRule($rule)
      Set-Acl -Path ("AD:" + $user.DistinguishedName) -AclObject $acl
      (Get-ADUser -Filter *).SamAccountName -join ','
    args: {executable: powershell}
- hosts: hop
  gather_facts: false
  tasks:
  - ansible.windows.win_shell: net localgroup Administrators "LAB\hopadmin" /add
    args: {executable: powershell}
    failed_when: false
