---
- hosts: dc
  gather_facts: false
  tasks:
  - ansible.windows.win_shell: |
      Import-Module ActiveDirectory
      $dn='CN=Users,DC=lab,DC=local'
      $p=ConvertTo-SecureString 'TgtGrp!1' -AsPlainText -Force
      try{Get-ADUser tgtgrp_user|Out-Null}catch{New-ADUser -Name tgtgrp_user -SamAccountName tgtgrp_user -AccountPassword $p -Enabled $true -PasswordNeverExpires $true -Path $dn}
      try{Get-ADGroup BBTest_Priv|Out-Null}catch{New-ADGroup -Name BBTest_Priv -SamAccountName BBTest_Priv -GroupScope Global -Path $dn}
      Add-ADGroupMember BBTest_Priv tgtgrp_user -ea 0
      $g=Get-ADGroup BBTest_Priv; $src=Get-ADUser domainuser
      $acl=Get-Acl ("AD:"+$g.DistinguishedName)
      $id=New-Object System.Security.Principal.SecurityIdentifier($src.SID)
      $rule=New-Object System.DirectoryServices.ActiveDirectoryAccessRule($id,[System.DirectoryServices.ActiveDirectoryRights]::GenericAll,[System.Security.AccessControl.AccessControlType]::Allow)
      $acl.AddAccessRule($rule); Set-Acl ("AD:"+$g.DistinguishedName) $acl
      'S06 ' + ((Get-ADUser -Filter *).SamAccountName -join ',')
    args: {executable: powershell}
