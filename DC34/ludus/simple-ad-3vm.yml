# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
# 3-box AD only: DC + hop + foothold. Router = debian-12. No kali. No debian-11.
ludus:
  - vm_name: "{{ range_id }}-dc"
    hostname: "{{ range_id }}-DC01"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: lab.local
      role: primary-dc
    testing:
      snapshot: true
      block_internet: true

  - vm_name: "{{ range_id }}-hop"
    hostname: "{{ range_id }}-HOP01"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 20
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: lab.local
      role: member
    testing:
      snapshot: true
      block_internet: true

  - vm_name: "{{ range_id }}-foothold"
    hostname: "{{ range_id }}-FOOTHOLD"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 30
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
      autologon_user: domainuser
      autologon_password: password
    domain:
      fqdn: lab.local
      role: member
    testing:
      snapshot: true
      block_internet: true

router:
  vm_name: "{{ range_id }}-router"
  hostname: "{{ range_id }}-router"
  template: debian-12-x64-server-template
  ram_gb: 2
  cpus: 2

defaults:
  ad_domain_functional_level: Win2012R2
  ad_forest_functional_level: Win2012R2
  ad_domain_admin: domainadmin
  ad_domain_admin_password: password
  ad_domain_user: domainuser
  ad_domain_user_password: password
  ad_domain_safe_mode_password: password
  timezone: America/New_York
  enable_dynamic_wallpaper: false

network:
  inter_vlan_default: ACCEPT
  external_default: ACCEPT
